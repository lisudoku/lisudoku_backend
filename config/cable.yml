development:
  adapter: redis
  url: <%= ENV.fetch("TV_REDIS_URL") { "redis://localhost:6379/1" } %>
  reconnect_attempts: <%= Array.new(1000, 1).inspect %>

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("TV_REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: lisudoku_backend_production
  reconnect_attempts: <%= Array.new(1000, 1).inspect %>
